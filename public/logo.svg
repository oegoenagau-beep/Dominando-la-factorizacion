<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Shield Badge -->
  <path d="M50 15 C65 15, 80 20, 80 35 C80 65, 50 85, 50 85 C50 85, 20 65, 20 35 C20 20, 35 15, 50 15 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Math symbols in shield -->
  <text x="50" y="45" font-family="'Fira Code', monospace" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">(x+a)</text>
  <text x="50" y="65" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">f(x)=0</text>
  <!-- Star on top -->
  <polygon points="50,22 52,27 57,27 53,30 55,35 50,32 45,35 47,30 43,27 48,27" fill="#fbbf24" />

  <!-- Text Brand -->
  <text x="98" y="44" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" fill="#0f172a">DOMINA LA FACTORIZACIÓN</text>
  <text x="98" y="66" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#0284c7" letter-spacing="1.5">UNIVERSIDAD DEL MAGDALENA</text>
  <text x="98" y="82" font-family="'Outfit', sans-serif" font-size="11" font-weight="500" fill="#64748b">Facultad de Ingeniería • Álgebra Fundamental</text>
</svg>
